<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>THE SWARM — RONIN ARCADE</title>
<meta name="theme-color" content="#181119">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%23a01818'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../shared/mobile.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; background:#140e16; overflow:hidden; }
  body { font-family:"Yu Mincho","Hiragino Mincho ProN",Georgia,serif; }
  #cv {
    max-width:100%; max-height:100%; aspect-ratio:960/600;
    border:1px solid rgba(255,150,90,.26); border-radius:5px;
    box-shadow:0 0 80px rgba(200,70,50,.18); touch-action:none;
  }
  /* on a phone the frame just steals pixels — go edge to edge */
  body.ra-touch #cv {
    border:none; border-radius:0; box-shadow:none;
    width:100%; height:100%; object-fit:contain; aspect-ratio:auto;
  }
</style>
</head>
<body>
<div class="ra-stage"><canvas id="cv" width="960" height="600"></canvas></div>
<a class="ra-chip ra-back" href="../">&#10554; ARCADE</a>

<div class="ra-pad" id="pad">
  <div class="ra-stick" id="stick"><div class="ra-knob" id="knob"></div></div>
</div>

<script type="module" src="js/game.js"></script>
</body>
</html>
