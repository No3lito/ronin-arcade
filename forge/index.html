<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>THE FORGE — RONIN ARCADE</title>
<meta name="theme-color" content="#070405">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%23a01818'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../shared/mobile.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; background:#070405; color:#e8d9c8; overflow:hidden; }
  body { font-family:"Yu Mincho","Hiragino Mincho ProN",Georgia,serif; }
  #backArcade {
    position:fixed; top:10px; left:10px; z-index:40; color:#c9a;
    background:rgba(7,4,5,.72); border:1px solid rgba(200,40,40,.45);
    padding:5px 12px; border-radius:4px; font:600 12px/1.4 serif;
    letter-spacing:.12em; text-decoration:none; opacity:.75;
  }
  #app { display:flex; width:100%; height:100%; }
  #left { flex:0 0 44%; display:flex; align-items:center; justify-content:center; position:relative; background:radial-gradient(ellipse at 50% 30%, #150a0c 0%, #070405 70%); }
  #view { height:min(92vh, 92vw * 16 / 9); aspect-ratio:9/16; box-shadow:0 0 60px rgba(160,20,20,.15); border:1px solid rgba(200,60,50,.25); border-radius:6px; }
  #right { flex:1; overflow-y:auto; padding:56px 28px 28px; }
  h1 { font-size:30px; color:#c92222; letter-spacing:.2em; margin-bottom:2px; }
  .sub { color:#9a8a7a; font-size:13px; letter-spacing:.14em; margin-bottom:20px; }
  .cat { margin-bottom:18px; }
  .cat h2 { font-size:13px; letter-spacing:.24em; color:#b9a695; margin-bottom:8px; border-bottom:1px solid rgba(200,60,50,.25); padding-bottom:4px; }
  .opts { display:flex; flex-wrap:wrap; gap:8px; }
  .chip {
    background:rgba(20,10,10,.7); border:1px solid rgba(200,60,50,.35); color:#e8d9c8;
    border-radius:4px; padding:7px 14px; cursor:pointer; font-family:inherit; font-size:13px;
    letter-spacing:.08em; transition:all .12s;
  }
  .chip:hover { border-color:#c92222; }
  .chip.on { background:#6b1414; border-color:#ff5a3a; box-shadow:0 0 12px rgba(200,30,30,.35); }
  .swatches { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .sw { width:26px; height:26px; border-radius:50%; cursor:pointer; border:2px solid rgba(255,255,255,.15); }
  .sw.on { border-color:#fff; box-shadow:0 0 8px rgba(255,255,255,.4); }
  input[type=color] { width:34px; height:30px; border:none; background:none; cursor:pointer; }
  #actions { display:flex; gap:12px; margin-top:24px; }
  .big-btn {
    flex:1; padding:14px; font-family:inherit; font-size:16px; letter-spacing:.22em; cursor:pointer;
    background:#a01818; color:#f5e9dc; border:1px solid #ff5a3a; border-radius:5px; font-weight:700;
  }
  .big-btn.alt { background:rgba(20,10,10,.7); border-color:rgba(200,60,50,.4); }
  .big-btn:hover { filter:brightness(1.2); }
  #loading { position:fixed; inset:0; background:#070405; z-index:60; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; }
  #loading .bar { width:300px; height:10px; background:rgba(30,15,15,.9); }
  #loading .bar i { display:block; height:100%; width:0; background:#c92222; }
  @media (max-width: 860px), (max-height: 620px) {
    html, body { height:100dvh; height:calc(var(--vh,1vh) * 100); overflow:hidden; }
    #app { flex-direction:column; height:100%; }
    /* the warrior gets the top half and stays fully visible */
    #left {
      flex:0 0 46%; min-height:0;
      padding:calc(env(safe-area-inset-top) + 6px) 8px 4px;
    }
    #view { height:100%; width:auto; max-width:100%; border-radius:4px; }
    /* every control lives in one scrolling tray under it */
    #right {
      flex:1 1 auto; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch;
      padding:14px 14px calc(env(safe-area-inset-bottom) + 90px);
      border-top:1px solid rgba(200,60,50,.28);
      background:linear-gradient(180deg, rgba(16,8,10,.6), rgba(7,4,5,.95));
      touch-action:pan-y;           /* the tray may scroll, the page may not */
    }
    h1 { font-size:20px; }
    .sub { font-size:11px; margin-bottom:12px; }
    .cat { margin-bottom:13px; }
    .cat h2 { font-size:11px; margin-bottom:6px; }
    /* fat-finger targets */
    .chip { padding:10px 15px; font-size:14px; }
    .sw { width:34px; height:34px; }
    .opts, .swatches { gap:9px; }
    /* actions pinned so SNAP is always reachable */
    #actions {
      position:fixed; left:0; right:0; bottom:0; z-index:50; margin:0;
      padding:10px 14px calc(env(safe-area-inset-bottom) + 10px);
      background:linear-gradient(180deg, rgba(7,4,5,.94), rgba(7,4,5,1));
      backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
      border-top:1px solid rgba(200,60,50,.3); gap:10px;
    }
    .big-btn { padding:14px; font-size:15px; }
    #backArcade { top:calc(env(safe-area-inset-top) + 6px); left:calc(env(safe-area-inset-left) + 6px); }
  }
</style>
</head>
<body>
<a id="backArcade" href="../">&#10554; ARCADE</a>
<div id="loading"><h1 style="color:#c92222">THE FORGE</h1><div class="bar"><i id="lbar"></i></div><div class="sub">stoking the coals…</div></div>
<div id="app">
  <div id="left"><canvas id="view" width="780" height="1386"></canvas></div>
  <div id="right">
    <h1>THE FORGE</h1>
    <div class="sub">鍛冶 — build your warrior · snap the portrait</div>
    <div class="cat"><h2>WARRIOR</h2><div class="opts" id="cGender"></div></div>
    <div class="cat"><h2>SKIN TONE</h2><div class="swatches" id="cSkin"></div></div>
    <div class="cat"><h2>GARB</h2><div class="opts" id="cOutfit"></div></div>
    <div class="cat"><h2>GARB COLOR</h2><div class="swatches" id="cClothColor"></div></div>
    <div class="cat"><h2>ARMOR</h2><div class="opts" id="cArmor"></div></div>
    <div class="cat"><h2>ARMOR COLOR</h2><div class="swatches" id="cArmorColor"></div></div>
    <div class="cat"><h2>WEAPON</h2><div class="opts" id="cWeapon"></div></div>
    <div class="cat"><h2>HAIR</h2><div class="opts" id="cHair"></div></div>
    <div class="cat"><h2>HAIR COLOR</h2><div class="swatches" id="cHairColor"></div></div>
    <div class="cat"><h2>MASK</h2><div class="opts" id="cMask"></div></div>
    <div class="cat"><h2>HEADWEAR</h2><div class="opts" id="cHat"></div></div>
    <div class="cat"><h2>HEADWEAR COLOR</h2><div class="swatches" id="cHatColor"></div></div>
    <div class="cat"><h2>BACKDROP</h2><div class="opts" id="cBg"></div></div>
    <div id="actions">
      <button class="big-btn alt" id="btnFate">⚂ FATE</button>
      <button class="big-btn" id="btnSnap">📷 SNAP</button>
    </div>
  </div>
</div>
<script type="module" src="js/forge.js"></script>
</body>
</html>
