<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ADVENTURE — RONIN ARCADE</title>
<meta name="theme-color" content="#070405">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%23a01818'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../shared/mobile.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; background:#070405; overflow:hidden; touch-action:none; }
  body { font-family:"Yu Mincho","Hiragino Mincho ProN",Georgia,serif; }
  #wrap { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
  #game { width:min(100vw, calc(100vh * 16 / 9)); aspect-ratio:16/9; display:block; image-rendering:pixelated; }
  #backArcade {
    color:#c9a;
    background:rgba(7,4,5,.72); border:1px solid rgba(200,40,40,.45);
    padding:5px 12px; border-radius:4px; font:600 12px/1.4 serif;
    letter-spacing:.12em; text-decoration:none; opacity:.75;
  }
  #touchUI { position:fixed; inset:0; z-index:30; display:none; pointer-events:none; }
  body.touch #touchUI { display:block; }
  #joy {
    position:absolute; left:4%; bottom:8%; width:130px; height:130px; border-radius:50%;
    border:1px solid rgba(200,60,60,.4); background:rgba(20,8,8,.3); pointer-events:auto;
  }
  #joyKnob { position:absolute; left:45px; top:45px; width:40px; height:40px; border-radius:50%; background:rgba(160,30,30,.55); }
  #tAtk {
    position:absolute; right:5%; bottom:10%; width:84px; height:84px; border-radius:50%;
    border:1px solid rgba(200,60,60,.55); background:rgba(20,8,8,.42); color:#e8d9c8;
    display:flex; align-items:center; justify-content:center; font:700 13px serif; pointer-events:auto;
  }
  #tAtk:active { background:rgba(160,24,24,.5); }

  /* --- shared mobile tweaks --- */
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  body.ra-touch #game { width:100%; height:100%; object-fit:contain; aspect-ratio:auto; }
  body.ra-touch #joy  { left:calc(env(safe-area-inset-left) + 20px);  bottom:calc(env(safe-area-inset-bottom) + 20px); }
  body.ra-touch #tAtk { right:calc(env(safe-area-inset-right) + 24px); bottom:calc(env(safe-area-inset-bottom) + 24px); width:94px; height:94px; }
  /* placement is handled by .ra-topleft in shared/mobile.css */
  body.ra-touch #touchUI { display:block; }
</style>
</head>
<body>
<div class="ra-topleft">
  <a id="backArcade" href="../">&#10554; ARCADE</a>
  <a id="guideBtn" href="#" style="color:#e8b48a;background:rgba(7,4,5,.72);border:1px solid rgba(200,40,40,.45);padding:5px 12px;border-radius:4px;font:600 12px/1.4 serif;letter-spacing:.12em;text-decoration:none;opacity:.85;">? GUIDE</a>
</div>
<div id="wrap"><canvas id="game" width="960" height="540"></canvas></div>
<div id="touchUI">
  <div id="joy"><div id="joyKnob"></div></div>
  <div class="tbtn" id="tAtk">SLASH</div>
</div>
<script type="module" src="js/game.js"></script>
</body>
</html>
